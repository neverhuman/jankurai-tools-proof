[[lane]]
name = "required"
command = "bash scripts/ci-local.sh required"
purpose = "run the governed launcher hostiles and complete locked workspace tests"

[[lane]]
name = "workspace-check"
command = "cargo check --workspace --locked"
purpose = "verify the locked workspace resolves and compiles"

[[lane]]
name = "contract"
command = "cargo nextest run --workspace"
purpose = "exercise public proof APIs and their typed behavior contracts"

[[lane]]
name = "contract-drift"
command = "bash scripts/ci-local.sh contract-drift"
purpose = "regenerate each Rust public API with pinned tools and verify reviewed digest baselines"

[[lane]]
name = "security"
command = "bash scripts/ci-local.sh security"
purpose = "run the canonical secret, dependency, SBOM, and workflow security lane"
