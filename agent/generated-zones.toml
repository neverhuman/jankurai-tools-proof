# Generated zones for jankurai-tools-proof.
# The only generated output tree in this Rust workspace is target/, produced by
# Cargo. It is never hand-edited and is regenerated by the build.

[[zone]]
path = "target/"
source = "crates/jankurai-proofbind + crates/jankurai-proofmark (Cargo workspace)"
command = "cargo build --workspace --locked"
read_only = true
write_policy = "generated_output"
